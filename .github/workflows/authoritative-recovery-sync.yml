name: Authoritative live recovery sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/authoritative_recovery_sync.py'
      - '.github/workflows/authoritative-recovery-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authoritative-recovery-sync
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Recover live source and validate every asset type
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/authoritative_recovery_sync.py

      - name: Commit authoritative recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m 'Authoritative live recovery sync'
          git pull --rebase origin main
          git push origin HEAD:main
