name: Cache broken external site images

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/cache_external_images.py'
      - '.github/workflows/cache-external-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-broken-external-site-images
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install downloader dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install requests

      - name: Cache external images and apply targeted runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/cache_external_images.py

      - name: Commit cached assets and targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          git add assets/external styles/overrides.css research/maple/v1/index.html \
            index.html team/index.html team/management-profile.html \
            our-communities/index.html merch/index.html merch/cart.html merch/product.html \
            join.html magazinesoftware/signup/index.html \
            .github/recovery-audit/external-image-cache.json

          if git diff --cached --quiet; then
            echo "No external image changes detected."
            exit 0
          fi

          git commit -m 'Cache external images and recover runtime dependencies'
          git pull --rebase origin main
          git push origin HEAD:main
