name: Cancel stale recovery run

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cancel-stale-recovery.yml'

permissions:
  contents: read

concurrency:
  group: authoritative-recovery-sync
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stale authoritative recovery run cancelled by concurrency."
