name: Compare live site against local recovered tree

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local recovered static site
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/openrockets-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/openrockets-http.log || true
          exit 1
      - name: Compare live and local recovered tree in Chromium
        run: python .github/scripts/compare_live_vs_local.py
