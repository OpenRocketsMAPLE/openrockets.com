name: Compare live site against recovered tree

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'join.html'
      - 'join/**'
      - 'opensource/**'
      - 'interkid/**'
      - 'our-communities/**'
      - 'team/**'
      - 'merch/**'
      - 'research/**'
      - 'magazinesoftware/**'
      - 'styles/**'
      - 'i/**'
      - 'v/**'
      - '26/**'
      - 'assets/**'
      - 'cdn-cgi/**'
      - '.github/scripts/compare_live_vs_pages.py'
      - '.github/workflows/compare-live-vs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compare-live-vs-recovered-tree
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Serve recovered repository locally
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/openrockets-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/openrockets-http.log || true
          exit 1
      - name: Compare live site and recovered tree in Chromium
        env:
          RECOVERED_BASE: http://127.0.0.1:8765/
        run: python .github/scripts/compare_live_vs_pages.py
