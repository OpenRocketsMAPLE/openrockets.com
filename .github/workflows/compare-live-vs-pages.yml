name: Compare live site against recovered Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/compare_live_vs_pages.py'
      - '.github/workflows/compare-live-vs-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compare-live-vs-pages
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Compare live and recovered site in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/compare_live_vs_pages.py

      - name: Commit comparison report and screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/recovery-audit/live-vs-pages
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record live-vs-recovered fidelity comparison'
          git pull --rebase origin main
          git push origin HEAD:main
