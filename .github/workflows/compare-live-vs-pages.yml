name: Compare live site against recovered Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'join.html'
      - 'join/**'
      - 'our-communities/**'
      - 'team/**'
      - 'merch/**'
      - 'research/**'
      - 'magazinesoftware/**'
      - 'styles/**'
      - 'i/**'
      - 'v/**'
      - '26/**'
      - 'assets/**'
      - '.github/recovery-audit/internal-reference-audit.json'
      - '.github/scripts/compare_live_vs_pages.py'
      - '.github/workflows/compare-live-vs-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: compare-live-vs-pages
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for native Pages deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..72}; do
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"               --jq '.workflow_runs[] | select(.name == "pages build and deployment") | [.status, (.conclusion // "")] | @tsv'               | head -n 1)"
            status="$(printf '%s' "$state" | cut -f1)"
            conclusion="$(printf '%s' "$state" | cut -f2)"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              exit 0
            fi
            if [ "$status" = "completed" ] && [ -n "$conclusion" ] && [ "$conclusion" != "success" ]; then
              echo "Pages deployment failed: $state"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for native Pages deployment"
          exit 1

      - name: Compare live and recovered site in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/compare_live_vs_pages.py

      - name: Commit comparison report and screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/recovery-audit/live-vs-pages
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record live-vs-recovered fidelity comparison'
          git pull --rebase origin main
          git push origin HEAD:main
