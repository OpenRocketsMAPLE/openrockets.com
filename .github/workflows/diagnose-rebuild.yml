name: Diagnose unresolved recovered assets

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/rebuild_verified_source.py'
      - '.github/workflows/diagnose-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild in working tree and print unresolved assets
        run: python .github/scripts/rebuild_verified_source.py
