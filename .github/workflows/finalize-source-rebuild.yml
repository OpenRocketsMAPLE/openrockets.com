name: Finalize verified source rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/rebuild_verified_source.py'
      - '.github/workflows/finalize-source-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-verified-source-rebuild
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean source and validate every local static reference
        run: python .github/scripts/rebuild_verified_source.py

      - name: Remove temporary recovery tooling
        run: |
          rm -f .github/scripts/rebuild_verified_source.py
          rm -f .github/workflows/finalize-source-rebuild.yml
          rm -f .github/workflows/diagnose-rebuild.yml

      - name: Commit verified recovered source
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild site from verified HTTP source'
          git pull --rebase origin main
          git push origin HEAD:main
