name: Publish-safe vendor path repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-vendor-path.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move underscore vendor directory and rewrite references
        shell: bash
        run: |
          set -euo pipefail

          test -d _vendor
          test ! -e vendor
          mv _vendor vendor

          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          text_suffixes = {
              ".html", ".htm", ".css", ".js", ".mjs", ".cjs",
              ".json", ".xml", ".txt", ".md", ".py", ".yml", ".yaml",
              ".svg"
          }

          changed = []
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              if ".git" in p.parts:
                  continue
              if p.suffix.lower() not in text_suffixes and p.name not in {
                  "CNAME", ".nojekyll"
              }:
                  continue
              try:
                  data = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              new = data.replace("_vendor/", "vendor/")
              new = new.replace("/_vendor/", "/vendor/")
              if new != data:
                  p.write_text(new, encoding="utf-8")
                  changed.append(p.as_posix())

          print(f"rewrote {len(changed)} text files")
          for item in changed[:200]:
              print(item)

          # Hard guards for the homepage and override stylesheet.
          index = Path("index.html").read_text(encoding="utf-8")
          assert "_vendor/" not in index
          assert "vendor/b.stripecdn.com/" in index

          overrides = Path("styles/overrides.css").read_text(encoding="utf-8")
          assert "_vendor/" not in overrides
          assert "../vendor/" in overrides
          PY

      - name: Remove one-shot repair workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-vendor-path.yml

      - name: Commit publish-safe vendor paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Move recovered vendor assets to publish-safe path'
          git push origin HEAD:main
