name: Import verified OpenRockets recovery snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-recovery.yml'

permissions:
  contents: write

jobs:
  import-recovery:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download recovery archive from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check gdown
          gdown 'https://drive.google.com/uc?id=1m8HtQOmfQRKZOV7YWIIA1-60J-VkPQH-' -O /tmp/openrockets_recovery.zip

      - name: Verify recovery archive
        shell: bash
        run: |
          set -euo pipefail
          echo '0f95b4a7a38eb1088670d6a60c7cf41255d32bba5fd86462570db5876f81eb41  /tmp/openrockets_recovery.zip' | sha256sum --check --strict
          unzip -t /tmp/openrockets_recovery.zip >/dev/null

      - name: Extract raw recovery snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openrockets_extract recovery_snapshot
          mkdir -p /tmp/openrockets_extract recovery_snapshot
          unzip -q /tmp/openrockets_recovery.zip -d /tmp/openrockets_extract
          test -d /tmp/openrockets_extract/openrockets_recovery
          cp -a /tmp/openrockets_extract/openrockets_recovery/. recovery_snapshot/

      - name: Add recovery provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > recovery_snapshot/RECOVERY_PROVENANCE.md <<'PROVENANCE'
          # Recovery provenance

          This directory is an immutable-style recovery snapshot of publicly retrievable content associated with `https://openrockets.com/`.

          Archive SHA-256:
          `0f95b4a7a38eb1088670d6a60c7cf41255d32bba5fd86462570db5876f81eb41`

          The snapshot includes rendered pages, captured network assets, source maps where publicly available, crawl metadata, redirects, and failure logs. External assets loaded by the site may also appear under `assets/`.

          Do not treat recovered browser artifacts as proof of the original private source-tree layout.
          PROVENANCE

      - name: Commit imported recovery snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovery_snapshot
          if git diff --cached --quiet; then
            echo 'Recovery snapshot already matches the verified archive; nothing to commit.'
            exit 0
          fi
          git commit -m 'Import verified openrockets.com recovery snapshot'
          git push origin HEAD:main
