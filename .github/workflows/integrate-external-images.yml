name: Integrate recoverable external images and feed

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_external_images.py'
      - '.github/workflows/integrate-external-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-external-images
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and localize recoverable visual assets
        run: python scripts/integrate_external_images.py

      - name: Commit recovered external images and feed
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No recoverable asset changes."
            exit 0
          fi
          git commit -m 'Integrate recoverable external images and live feed'
          git pull --rebase origin main
          git push origin HEAD:main
