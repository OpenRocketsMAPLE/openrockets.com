name: Localize recovered static vendor assets

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/localize_static_vendor.py'
      - '.github/workflows/localize-static-vendor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localize safe static vendor dependencies
        run: python scripts/localize_static_vendor.py

      - name: Remove one-shot vendor localization tooling
        shell: bash
        run: |
          rm -f scripts/localize_static_vendor.py
          rm -f .github/workflows/localize-static-vendor.yml
          rmdir scripts 2>/dev/null || true

      - name: Commit localized static dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Localize recovered static vendor dependencies'
          git push origin HEAD:main
