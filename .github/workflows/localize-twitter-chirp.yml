name: Localize Twitter Chirp fonts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-twitter-chirp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact Twitter Chirp fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts/twitter
          curl -L --fail --retry 3 'https://abs.twimg.com/fonts/subset/Chirp-Regular.c88864db.latin.woff2' -o assets/fonts/twitter/Chirp-Regular.woff2
          curl -L --fail --retry 3 'https://abs.twimg.com/fonts/subset/Chirp-Medium.ca6d679a.latin.woff2' -o assets/fonts/twitter/Chirp-Medium.woff2
          curl -L --fail --retry 3 'https://abs.twimg.com/fonts/subset/Chirp-Bold.d8ac01b2.latin.woff2' -o assets/fonts/twitter/Chirp-Bold.woff2
          python - <<'PY'
          from pathlib import Path
          for p in Path('assets/fonts/twitter').glob('*.woff2'):
              b=p.read_bytes()
              if not (b.startswith(b'wOF2') and len(b) > 10000):
                  raise SystemExit(f'Invalid WOFF2: {p} ({len(b)} bytes, {b[:8]!r})')
              print(p, len(b))
          PY

      - name: Point Twitter cards at local Chirp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              'https://abs.twimg.com/fonts/subset/Chirp-Regular.c88864db.latin.woff2',
              'assets/fonts/twitter/Chirp-Regular.woff2'
          )
          s=s.replace(
              'https://abs.twimg.com/fonts/subset/Chirp-Medium.ca6d679a.latin.woff2',
              'assets/fonts/twitter/Chirp-Medium.woff2'
          )
          s=s.replace(
              'https://abs.twimg.com/fonts/subset/Chirp-Bold.d8ac01b2.latin.woff2',
              'assets/fonts/twitter/Chirp-Bold.woff2'
          )
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/localize-twitter-chirp.yml

      - name: Commit Twitter font assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Bundle Twitter Chirp fonts for native post cards'
          git pull --rebase origin main
          git push origin HEAD:main
