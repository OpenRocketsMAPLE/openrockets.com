name: Verify deployed OpenRockets recovery

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/pages_smoke.py'
      - '.github/workflows/pages-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait briefly for Pages deployment
        shell: bash
        run: sleep 20

      - name: Test deployed site
        shell: bash
        run: python scripts/pages_smoke.py

      - name: Commit smoke report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/recovery-audit/pages-smoke.json || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record deployed-site smoke test'
          git push origin HEAD:main
