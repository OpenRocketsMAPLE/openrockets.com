name: Build GitHub Pages branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage website from repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openrockets-pages
          mkdir -p /tmp/openrockets-pages

          rsync -a ./ /tmp/openrockets-pages/             --exclude='.git/'             --exclude='.github/'             --exclude='README.md'             --exclude='scripts/'             --exclude='recovery_snapshot/'

          touch /tmp/openrockets-pages/.nojekyll
          test -f /tmp/openrockets-pages/index.html

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          git checkout --orphan gh-pages
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -a /tmp/openrockets-pages/. .

          git add -A
          git commit -m 'Publish OpenRockets site'
          git push --force origin HEAD:gh-pages
