name: Build recovery preview branch

on:
  push:
    branches:
      - main
    paths:
      - 'recovery_snapshot/**'
      - 'scripts/build_pages_preview.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview-branch
  cancel-in-progress: true

jobs:
  build-and-publish-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build recovered-site preview
        run: python scripts/build_pages_preview.py

      - name: Stage built site outside working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openrockets-pages
          mkdir -p /tmp/openrockets-pages
          cp -a _site/. /tmp/openrockets-pages/

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          git checkout --orphan gh-pages
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -a /tmp/openrockets-pages/. .

          git add -A
          git commit -m 'Publish recovered openrockets.com preview'
          git push --force origin HEAD:gh-pages
