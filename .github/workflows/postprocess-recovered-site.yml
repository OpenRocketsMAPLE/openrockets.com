name: Normalize recovered internal paths

on:
  push:
    branches:
      - main
    paths:
      - '.github/recovery-audit/authoritative-recovery-sync.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-recovered-internal-paths
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize recovered internal references
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/postprocess_recovered_site.py

      - name: Commit path normalization and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          git add -A
          if git diff --cached --quiet; then
            echo "No path changes detected."
            exit 0
          fi

          git commit -m 'Normalize recovered internal asset paths'
          git pull --rebase origin main
          git push origin HEAD:main
