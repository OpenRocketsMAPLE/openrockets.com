name: Rebuild recovered pages from verified source

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/rebuild_verified_source.py'
      - '.github/workflows/rebuild-verified-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-verified-source
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild clean page sources and validate local assets
        run: python .github/scripts/rebuild_verified_source.py
      - name: Remove one-shot recovery tooling
        run: |
          rm -f .github/scripts/rebuild_verified_source.py
          rm -f .github/workflows/rebuild-verified-source.yml
      - name: Commit rebuilt recovered site
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m 'Rebuild recovered pages from verified HTTP source'
          git pull --rebase origin main
          git push origin HEAD:main
