name: Recover missing ScienTeen brand asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-scienteen-wordmark.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact current ScienTeen wordmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/external/scienteen.com
          curl -L --fail --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            'https://scienteen.com/assets/brand/scientific-teenager-wordmark-transparent.png' \
            -o assets/external/scienteen.com/scientific-teenager-wordmark-transparent.png

          python - <<'PY'
          from pathlib import Path
          p = Path('assets/external/scienteen.com/scientific-teenager-wordmark-transparent.png')
          b = p.read_bytes()
          if not b.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit(f'Not a PNG; first bytes={b[:32]!r}')
          print(f'Validated PNG: {len(b)} bytes')
          PY

      - name: Rewrite partner badge to recovered local asset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://scienteen.com/brand/welcomepage2.png'
          new = 'assets/external/scienteen.com/scientific-teenager-wordmark-transparent.png'
          if old not in s:
              raise SystemExit('Expected ScienTeen legacy image URL not found in index.html')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        shell: bash
        run: rm -f .github/workflows/recover-scienteen-wordmark.yml

      - name: Commit recovered asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Recover current ScienTeen brand asset'
          git pull --rebase origin main
          git push origin HEAD:main
