name: Repair recovered runtime assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/repair_runtime_assets.py'
      - '.github/workflows/repair-runtime-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-runtime-assets
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repair dependency
        shell: bash
        run: python -m pip install requests

      - name: Repair recovered runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/repair_runtime_assets.py

      - name: Commit repaired site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          git add index.html team research styles vendor assets data .github/recovery-audit/runtime-asset-repair.json || true

          if git diff --cached --quiet; then
            echo "No site-content changes detected."
            exit 0
          fi

          git commit -m 'Repair recovered images fonts styles and runtime assets'
          git pull --rebase origin main
          git push origin HEAD:main
