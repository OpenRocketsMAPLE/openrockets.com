name: Restructure recovered site into repository root

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/restructure_recovery.py'
      - '.github/workflows/restructure-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restructure recovered site
        run: python scripts/restructure_recovery.py

      - name: Commit clean site structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          test -f index.html
          test ! -d recovery_snapshot

          git add -A
          git commit -m 'Restructure recovered site into repository root'
          git push origin HEAD:main
