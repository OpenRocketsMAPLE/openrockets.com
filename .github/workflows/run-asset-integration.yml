name: Integrate recovered assets into publishable site

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/integrate_recovered_assets.py'
      - '.github/workflows/run-asset-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recovered-asset-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate validated external and internal assets
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/integrate_recovered_assets.py

      - name: Normalize route-aware internal paths
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/postprocess_recovered_site.py

      - name: Validate publishable asset structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          assert not (root / "_vendor").exists(), "_vendor still exists"
          assert (root / "vendor").is_dir(), "vendor directory missing"

          vendor_files = [p for p in (root / "vendor").rglob("*") if p.is_file()]
          if len(vendor_files) < 100:
              raise SystemExit(f"vendor tree unexpectedly small: {len(vendor_files)} files")

          backslash_paths = [
              p.as_posix()
              for p in root.iterdir()
              if p.is_file() and "\\" in p.name
          ]
          if backslash_paths:
              raise SystemExit(f"malformed backslash filenames remain: {backslash_paths}")

          stale_refs = []
          suffixes = {".html", ".htm", ".css", ".js", ".mjs", ".cjs", ".json", ".xml", ".txt", ".md", ".svg", ".py", ".yml", ".yaml"}
          for p in root.rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              if p.suffix.lower() not in suffixes:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              if "_vendor/" in text:
                  stale_refs.append(p.as_posix())

          if stale_refs:
              raise SystemExit(f"legacy _vendor references remain: {stale_refs[:30]}")

          print(f"vendor files: {len(vendor_files)}")
          print("publishable asset structure validation passed")
          PY

      - name: Commit integrated recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m 'Integrate recovered assets into publishable site'
          git pull --rebase origin main
          git push origin HEAD:main
