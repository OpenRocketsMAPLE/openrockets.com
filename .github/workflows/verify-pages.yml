name: Verify deployed OpenRockets Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'join.html'
      - 'join/**'
      - 'opensource/**'
      - 'interkid/**'
      - 'our-communities/**'
      - 'team/**'
      - 'merch/**'
      - 'research/**'
      - 'magazinesoftware/**'
      - 'styles/**'
      - 'i/**'
      - 'v/**'
      - '26/**'
      - 'assets/**'
      - '.github/scripts/verify_pages.py'
      - '.github/workflows/verify-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wait for native Pages deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          success=0
          for attempt in {1..72}; do
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '.workflow_runs[] | select(.name == "pages build and deployment") | [.status, (.conclusion // "")] | @tsv' | head -n 1)"
            status="$(printf '%s' "$state" | cut -f1)"
            conclusion="$(printf '%s' "$state" | cut -f2)"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then success=1; break; fi
            if [ "$status" = "completed" ] && [ -n "$conclusion" ] && [ "$conclusion" != "success" ]; then
              echo "Pages deployment failed: $state"; exit 1
            fi
            sleep 5
          done
          [ "$success" = "1" ] || { echo "Timed out waiting for Pages deployment"; exit 1; }
      - name: Verify deployed browser behavior
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python .github/scripts/verify_pages.py
