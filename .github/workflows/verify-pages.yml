name: Verify deployed OpenRockets Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'join.html'
      - 'our-communities/**'
      - 'team/**'
      - 'merch/**'
      - 'research/**'
      - 'magazinesoftware/**'
      - 'styles/**'
      - 'i/**'
      - 'v/**'
      - '26/**'
      - '.github/scripts/rewrite_pages_paths.py'
      - '.github/scripts/verify_pages.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/verify-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify exact deployed source commit and browser behavior
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/verify_pages.py

      - name: Commit verification report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenRockets Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'

          git add .github/recovery-audit/pages-smoke.json || true
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'Record deployed-site verification'
          git pull --rebase origin main
          git push origin HEAD:main
