<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MAPLE</title>
  <meta http-equiv="refresh" content="2;url=https://maplelicense.substack.com/">
  <link rel="canonical" href="https://maplelicense.substack.com/">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; background: #fff; }
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow: hidden; }
    iframe { display: block; width: min(760px, calc(100vw - 32px)); height: min(560px, calc(100dvh - 32px)); min-height: 420px; margin: 0; border: 0; background: #fff; overflow: hidden; }
    @media (max-width: 640px) { iframe { width: calc(100vw - 20px); height: min(600px, calc(100dvh - 20px)); min-height: 460px; } }
  </style>
</head>
<body>
  <iframe scrolling="no" src="https://maplelicense.substack.com/embed" title="MAPLE on Substack"></iframe>
  <script>window.setTimeout(function () { window.location.replace('https://maplelicense.substack.com/'); }, 900);</script>
</body>
</html>
