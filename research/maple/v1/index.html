<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecting to OpenRockets OpenSource</title>
  <meta http-equiv="refresh" content="0;url=https://opensource.openrockets.com/">
  <link rel="canonical" href="https://opensource.openrockets.com/">
  <script>
    (function () {
      var target = "https://opensource.openrockets.com/";
      window.location.replace(target + window.location.search + window.location.hash);
    }());
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://opensource.openrockets.com/">opensource.openrockets.com</a>…</p>
</body>
</html>
