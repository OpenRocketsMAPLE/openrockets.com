<script id="openrockets-mobile-nav-script">
      (() => {
        const nav = document.getElementById('navigation-menu');
        const toggle = document.getElementById('or-mobile-nav-toggle');
        if (!nav || !toggle) return;
        const setOpen = (open) => {
          nav.classList.toggle('or-mobile-nav-open', open);
          toggle.setAttribute('aria-expanded', String(open));
          toggle.setAttribute('aria-label', open ? 'Collapse navigation' : 'Expand navigation');
        };
        toggle.addEventListener('click', () => setOpen(!nav.classList.contains('or-mobile-nav-open')));
        document.addEventListener('keydown', event => {
          if (event.key === 'Escape' && nav.classList.contains('or-mobile-nav-open')) {
            setOpen(false);
            toggle.focus();
          }
        });
        addEventListener('resize', () => {
          if (innerWidth > 980) setOpen(false);
        }, {passive:true});
      })();
      </script>
<script>
(() => {
  const header=document.getElementById("main-header");
  function report(){
    const height=Math.ceil(header.getBoundingClientRect().height);
    if(height>0)parent.postMessage({type:"openrockets-master-header-height-v2",height},"*");
  }
  new ResizeObserver(report).observe(header);
  addEventListener("load",report);
  addEventListener("resize",report,{passive:true});
  document.fonts?.ready.then(report);
  addEventListener("message",event=>{
    if(event.source===parent&&event.data?.type==="openrockets-master-header-measure-v2")report();
  });
  report();
})();
</script>
