@font-face{font-family:bootstrap-icons;src:url("https://openrockets.com/vendor/cdn.jsdelivr.net/e837c4d1eca8ba00__bootstrap-icons.woff2") format("woff2");font-display:block;}

<body style="padding-top: 0rem;">
<div id="__next"><div>
<header id="main-header" style="position: sticky; top: 0; left: 0; width: 100%; filter: invert(1); background-color: white; z-index: 10000; transition: transform 0.3s ease;" class="hds-color-mode navigation section section--white hds-mode--light">
        <div class="section-container navigation__layout" style="display: flex; width: 100%; max-width: 100%; padding: 0 20px;">
          <nav class="hds-navigation-menu navigation-menu navigation-menu--homepage" id="navigation-menu" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            
            <!-- OpenRockets Brand Logo -->
            <div class="or-mobile-nav-brand" style="flex: 1; display: flex; align-items: center; justify-content: flex-start; padding-left: 15px;">
              <img src="v/openrockets.png" alt="OpenRockets Logo" style="filter: invert(1); width: 104px; background-color: transparent;">

            <button id="or-mobile-nav-toggle" class="or-mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="or-mobile-nav-panel" aria-label="Expand navigation">

            </button>

                <li class="hds-navigation-menu__item navigation-item">

                  <a class="hds-button navigation-cta-button hds-button--secondary-on-quiet or-header-action" href="https://maple.openrockets.com/">
                    <i class="bi bi-shield-check" aria-hidden="true"></i>

                </li>

</div></div>
<script id="openrockets-mobile-nav-script">
      (() => {
        const nav = document.getElementById('navigation-menu');
        const toggle = document.getElementById('or-mobile-nav-toggle');
        if (!nav || !toggle) return;
        const setOpen = (open) => {
          nav.classList.toggle('or-mobile-nav-open', open);
          toggle.setAttribute('aria-expanded', String(open));
          toggle.setAttribute('aria-label', open ? 'Collapse navigation' : 'Expand navigation');
        };
        toggle.addEventListener('click', () => setOpen(!nav.classList.contains('or-mobile-nav-open')));
        document.addEventListener('keydown', event => {
          if (event.key === 'Escape' && nav.classList.contains('or-mobile-nav-open')) {
            setOpen(false);
            toggle.focus();
          }
        });
        addEventListener('resize', () => {
          if (innerWidth > 980) setOpen(false);
        }, {passive:true});
      })();
      </script>
<script>
(() => {
  const header=document.getElementById("main-header");
  function report(){
    const height=Math.ceil(header.getBoundingClientRect().height);
    if(height>0)parent.postMessage({type:"openrockets-master-header-height-v2",height},"*");
  }
  new ResizeObserver(report).observe(header);
  addEventListener("load",report);
  addEventListener("resize",report,{passive:true});
  document.fonts?.ready.then(report);
  addEventListener("message",event=>{
    if(event.source===parent&&event.data?.type==="openrockets-master-header-measure-v2")report();
  });
  report();
})();
</script>
