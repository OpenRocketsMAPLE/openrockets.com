<!DOCTYPE html><html lang="en-US"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="../i/assets/static/openthread_logo_bash-trans-removebg-preview%20(1).png">
  <title>Jakob Friedrich | OpenRockets</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fbfbfd;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #1d1d1f;
    }
    * { box-sizing: border-box; }
    .card {
      width: 100%;
      height: 286px;
      padding: 14px 24px 18px;
      background: #fbfbfd;
    }
    .profile-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 10px;
      color: #1d1d1f;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
    }
    .profile-link img {
      display: block;
      width: 15px;
      height: 15px;
      object-fit: contain;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 390px);
      gap: 28px;
      align-items: center;
      height: 230px;
    }
    .copy { min-width: 0; }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.12;
      letter-spacing: -0.02em;
    }
    h2 {
      margin: 0 0 16px;
      color: #86868b;
      font-size: clamp(15px, 1.7vw, 19px);
      font-weight: 500;
      line-height: 1.25;
    }
    p {
      display: -webkit-box;
      max-width: 640px;
      margin: 0;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      font-size: 16px;
      line-height: 1.45;
    }
    .portrait-wrap {
      width: 100%;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow: visible;
    }
    .portrait {
      display: block;
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      object-position: center;
    }
    .portrait-placeholder {
      height: 100%;
      aspect-ratio: 1 / 1;
      max-width: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: #e9edf2;
      color: #425268;
      font-size: clamp(40px, 6vw, 72px);
      font-weight: 600;
      letter-spacing: -0.06em;
      user-select: none;
    }
    @media (max-width: 600px) {
      .card {
        height: 210px;
        padding: 10px 12px 12px;
      }
      .profile-link {
        margin-bottom: 7px;
        font-size: 11px;
        gap: 5px;
      }
      .profile-link img {
        width: 12px;
        height: 12px;
      }
      .row {
        grid-template-columns: minmax(0, 1fr) minmax(0, 42vw);
        gap: 12px;
        height: 166px;
      }
      h1 { font-size: clamp(18px, 5vw, 24px); }
      h2 {
        margin-bottom: 9px;
        font-size: 13px;
      }
      p {
        font-size: 12px;
        line-height: 1.35;
      }
      .portrait-wrap {
        height: 166px;
      }
      .portrait {
        height: 100%;
        width: auto;
        max-width: 100%;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>
  <main id="card" class="card">
      <a class="profile-link" href="https://enterprise.openrockets.com/investor/profiles/jakob-friedrich" target="_top" rel="noopener">
        <img src="https://openrockets.com/i/assets/static/openthread_logo_bash-trans-removebg-preview%20(1).png" alt="">
        <span>View Full Profile</span>
      </a>
      <article class="row" aria-label="Jakob Friedrich">
        <div class="copy">
          <h1>Jakob Friedrich</h1>
          <h2>German Representative</h2>
          <p>Jakob Friedrich is the German Representative for the OpenRockets 2026 cohort.</p>
        </div>
        <div class="portrait-wrap">
          <img class="portrait" src="../assets/external/github.com/Joko-26__b0d868074d1bea9400.jpg" alt="Jakob Friedrich" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="portrait-placeholder" role="img" aria-label="Portrait unavailable for Jakob Friedrich">JF</div>
        </div>
      </article>
    </main>
  <script>
    const favicon = 'https://openrockets.com/i/assets/static/openthread_logo_bash-trans-removebg-preview%20(1).png';
    const profiles = {
      'hugo-torres': {
        name: 'Hugo Torres',
        title: 'Chief Information Officer',
        about: 'Hugo is the CIO of OpenRockets Inc. and the lead developer of ZeroProfit Co.',
        image: 'https://enterprise.openrockets.com/images/hugo-torres.webp'
      },
      'arjun-jamgade': {
        name: 'Arjun Jamgade',
        title: 'Project Lead at OpenRockets MAPLE',
        about: 'Arjun leads OpenRockets MAPLE, connecting science, technology, and young creators.',
        image: 'https://i.imgur.com/sje9MSc.png'
      },
      'neksha-desilva': {
        name: 'Neksha DeSilva',
        title: 'Chief Technology Officer',
        about: 'Neksha is the Chief Technology Officer at OpenRockets Incorporated.',
        image: 'https://i.imgur.com/ICkuUPx.png'
      },
      'anabel-caballero': {
        name: 'Anabel Caballero',
        title: 'Management Division',
        about: 'Anabel is a member of the OpenRockets management team.',
        image: 'https://enterprise.openrockets.com/images/anabel-c.jpg'
      },
      'yuxuan-lin': {
        name: 'Yuxuan Lin',
        title: 'Founding Member & Chief Design Officer',
        about: "Yuxuan is the Chief Design Officer of OpenRockets Inc., leading the company's visual identity and brand development.",
        image: 'https://enterprise.openrockets.com/images/Yuxuan.jpg'
      },
      'lucas-gabriel': {
        name: 'Lucas Gabriel',
        title: 'Mexican Representative',
        about: 'Lucas Gabriel is the Mexican Representative for the OpenRockets 2026 cohort.',
        image: 'https://enterprise.openrockets.com/lucas-gabriel.png'
      },
      'jakob-friedrich': {
        name: 'Jakob Friedrich',
        title: 'German Representative',
        about: 'Jakob Friedrich is the German Representative for the OpenRockets 2026 cohort.',
        image: 'https://github.com/Joko-26.png?size=460'
      }
    };

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('person');
    const profile = profiles[slug] || profiles['hugo-torres'];
    const fullProfile = 'https://enterprise.openrockets.com/investor/profiles/' + slug;

    const initials = profile.name
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 2)
      .map((part) => part[0].toUpperCase())
      .join('');

    document.title = profile.name + ' | OpenRockets';
    const portraitMarkup = profile.image
      ? `<img class="portrait" src="${profile.image}" alt="${profile.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="portrait-placeholder" role="img" aria-label="Portrait unavailable for ${profile.name}">${initials}</div>`
      : `<div class="portrait-placeholder" style="display:flex" role="img" aria-label="Portrait unavailable for ${profile.name}">${initials}</div>`;

    document.getElementById('card').innerHTML = `
      <a class="profile-link" href="${fullProfile}" target="_top" rel="noopener">
        <img src="${favicon}" alt="">
        <span>View Full Profile</span>
      </a>
      <article class="row" aria-label="${profile.name}">
        <div class="copy">
          <h1>${profile.name}</h1>
          <h2>${profile.title}</h2>
          <p>${profile.about}</p>
        </div>
        <div class="portrait-wrap">
          ${portraitMarkup}
        </div>
      </article>
    `;
  </script>


</body></html>
